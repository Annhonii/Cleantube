name: Compile check

# Builds a debug APK on every branch except main and on pull requests, so a change can be checked
# before it is merged. It never publishes a release (build.yml does that for main only).
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: voidstream-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
